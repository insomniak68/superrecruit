id: python_fundamentals
name: "Python Fundamentals"
category: programming
skill_tags: ["python", "programming"]
time_limit_minutes: 30
passing_score: 60
questions:
  - id: pf_001
    type: coding
    difficulty: easy
    prompt: |
      Write a function `flatten(lst)` that takes a nested list of integers and returns a flat list.
      Example: flatten([1, [2, [3, 4], 5], 6]) → [1, 2, 3, 4, 5, 6]
    test_cases:
      - input: [[1, [2, [3, 4], 5], 6]]
        expected: [1, 2, 3, 4, 5, 6]
      - input: [[1, 2, 3]]
        expected: [1, 2, 3]
      - input: [[]]
        expected: []
      - input: [[[[[1]]]]]
        expected: [1]
    points: 15

  - id: pf_002
    type: coding
    difficulty: medium
    prompt: |
      Write a function `group_by(items, key_fn)` that groups a list of items by the result of key_fn.
      Return a dictionary where keys are the results of key_fn and values are lists of matching items.

      Example: group_by(["apple", "banana", "avocado", "blueberry"], lambda x: x[0])
      → {"a": ["apple", "avocado"], "b": ["banana", "blueberry"]}
    test_cases:
      - input: [["apple", "banana", "avocado", "blueberry"]]
        expected: {"a": ["apple", "avocado"], "b": ["banana", "blueberry"]}
      - input: [[1, 2, 3, 4, 5, 6]]
        expected: {1: [1, 3, 5], 0: [2, 4, 6]}
    points: 15

  - id: pf_003
    type: coding
    difficulty: medium
    prompt: |
      Implement a class `LRUCache(capacity)` with methods:
      - `get(key)`: return value if key exists, else -1
      - `put(key, value)`: insert/update. If at capacity, evict least recently used.

      Both operations should be O(1) average time.
    test_cases:
      - input: "LRUCache(2); put(1,1); put(2,2); get(1); put(3,3); get(2)"
        expected: "1; -1"
    points: 25

  - id: pf_004
    type: coding
    difficulty: easy
    prompt: |
      Write a function `most_frequent(lst)` that returns the most frequently occurring element.
      If there's a tie, return any one of the most frequent elements.
    test_cases:
      - input: [[1, 2, 2, 3, 3, 3]]
        expected: 3
      - input: [["a", "b", "a"]]
        expected: "a"
      - input: [[1]]
        expected: 1
    points: 10

  - id: pf_005
    type: coding
    difficulty: hard
    prompt: |
      Write a decorator `@retry(max_attempts=3, delay=1)` that retries a function up to max_attempts
      times if it raises an exception, waiting `delay` seconds between attempts.
      After all attempts fail, re-raise the last exception.
      The decorator should preserve the original function's name and docstring.
    test_cases: []
    rubric: |
      - Uses functools.wraps (2 pts)
      - Implements retry loop with counter (5 pts)
      - Handles delay between retries (3 pts)
      - Re-raises last exception after all attempts (3 pts)
      - Works as parameterized decorator (2 pts)
    points: 15
