<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SuperRecruit{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .badge-high { @apply bg-green-100 text-green-800; }
        .badge-medium { @apply bg-yellow-100 text-yellow-800; }
        .badge-low { @apply bg-red-100 text-red-800; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-indigo-600">⚡ SuperRecruit</a>
            <div class="flex gap-4">
                <a href="/candidates" class="text-gray-600 hover:text-indigo-600">Candidates</a>
                <a href="/api/test-bank" class="text-gray-600 hover:text-indigo-600">Test Bank</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
