{% extends "base.html" %}
{% block title %}Knowledge Base — SuperRecruit{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Knowledge Base</h1>
            <p class="text-gray-600 mt-1">Skill concepts, role archetypes, and employer interpretations</p>
        </div>
        <div class="flex gap-2">
            <button onclick="exportKB()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm font-medium">Export JSON</button>
            <label class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm font-medium cursor-pointer">
                Import JSON <input type="file" accept=".json" onchange="importKB(event)" class="hidden">
            </label>
        </div>
    </div>

    <!-- Search -->
    <div>
        <input type="text" id="searchInput" placeholder="Search skills and roles…"
            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            oninput="debounceSearch()">
    </div>

    <!-- Tabs -->
    <div class="border-b">
        <nav class="flex gap-4">
            <button onclick="showTab('skills')" id="tab-skills" class="pb-2 border-b-2 border-indigo-600 text-indigo-600 font-medium text-sm">Skills</button>
            <button onclick="showTab('roles')" id="tab-roles" class="pb-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm">Roles</button>
        </nav>
    </div>

    <!-- Skills Tab -->
    <div id="panel-skills">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold">Skill Concepts</h2>
            <button onclick="showSkillModal()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">+ Add Skill</button>
        </div>
        <div id="skillsList" class="grid gap-3"></div>
    </div>

    <!-- Roles Tab -->
    <div id="panel-roles" class="hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold">Role Archetypes</h2>
            <button onclick="showRoleModal()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">+ Add Role</button>
        </div>
        <div id="rolesList" class="grid gap-3"></div>
    </div>
</div>

<!-- Skill Modal -->
<div id="skillModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-lg p-6 w-full max-w-md">
        <h3 id="skillModalTitle" class="text-lg font-bold mb-4">Add Skill Concept</h3>
        <input type="hidden" id="skillEditId">
        <div class="space-y-3">
            <div><label class="block text-sm font-medium text-gray-700">Name</label><input id="skName" class="w-full border rounded px-3 py-1.5"></div>
            <div><label class="block text-sm font-medium text-gray-700">Category</label>
                <select id="skCategory" class="w-full border rounded px-3 py-1.5">
                    <option>programming</option><option>framework</option><option>database</option><option>cloud</option>
                    <option>devops</option><option>methodology</option><option>data</option><option>security</option><option>other</option>
                </select>
            </div>
            <div><label class="block text-sm font-medium text-gray-700">Description</label><textarea id="skDesc" rows="2" class="w-full border rounded px-3 py-1.5"></textarea></div>
            <div><label class="block text-sm font-medium text-gray-700">Subconcepts (comma-separated)</label><input id="skSub" class="w-full border rounded px-3 py-1.5"></div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
            <button onclick="closeSkillModal()" class="px-4 py-2 bg-gray-100 rounded-lg text-sm">Cancel</button>
            <button onclick="saveSkill()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">Save</button>
        </div>
    </div>
</div>

<!-- Role Modal -->
<div id="roleModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-lg p-6 w-full max-w-md">
        <h3 id="roleModalTitle" class="text-lg font-bold mb-4">Add Role Archetype</h3>
        <input type="hidden" id="roleEditId">
        <div class="space-y-3">
            <div><label class="block text-sm font-medium text-gray-700">Name</label><input id="rlName" class="w-full border rounded px-3 py-1.5"></div>
            <div><label class="block text-sm font-medium text-gray-700">Description</label><textarea id="rlDesc" rows="2" class="w-full border rounded px-3 py-1.5"></textarea></div>
            <div><label class="block text-sm font-medium text-gray-700">Green Flags (comma-separated)</label><input id="rlGreen" class="w-full border rounded px-3 py-1.5"></div>
            <div><label class="block text-sm font-medium text-gray-700">Red Flags (comma-separated)</label><input id="rlRed" class="w-full border rounded px-3 py-1.5"></div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
            <button onclick="closeRoleModal()" class="px-4 py-2 bg-gray-100 rounded-lg text-sm">Cancel</button>
            <button onclick="saveRole()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">Save</button>
        </div>
    </div>
</div>

<div id="importStatus" class="fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded-lg hidden text-sm"></div>

<script>
const API = '/api/kb';
let searchTimer;

function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 300);
}

async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) { loadSkills(); loadRoles(); return; }
    const res = await fetch(`${API}/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    renderSkills(data.skills);
    renderRoles(data.roles);
}

function showTab(tab) {
    document.getElementById('panel-skills').classList.toggle('hidden', tab !== 'skills');
    document.getElementById('panel-roles').classList.toggle('hidden', tab !== 'roles');
    document.getElementById('tab-skills').classList.toggle('border-indigo-600', tab === 'skills');
    document.getElementById('tab-skills').classList.toggle('text-indigo-600', tab === 'skills');
    document.getElementById('tab-skills').classList.toggle('border-transparent', tab !== 'skills');
    document.getElementById('tab-roles').classList.toggle('border-indigo-600', tab === 'roles');
    document.getElementById('tab-roles').classList.toggle('text-indigo-600', tab === 'roles');
    document.getElementById('tab-roles').classList.toggle('border-transparent', tab !== 'roles');
}

// Skills
async function loadSkills() {
    const res = await fetch(`${API}/skills`);
    renderSkills(await res.json());
}

function renderSkills(skills) {
    const el = document.getElementById('skillsList');
    if (!skills.length) { el.innerHTML = '<p class="text-gray-500 text-sm">No skill concepts yet.</p>'; return; }
    el.innerHTML = skills.map(s => `
        <div class="bg-white rounded-lg shadow-sm border p-4 flex justify-between items-start">
            <div>
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-900">${s.name}</span>
                    <span class="text-xs px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full">${s.category}</span>
                    <span class="text-xs text-gray-400">v${s.version}</span>
                </div>
                <p class="text-sm text-gray-600 mt-1">${s.description || '—'}</p>
                ${s.subconcepts.length ? `<p class="text-xs text-gray-500 mt-1">Subconcepts: ${s.subconcepts.join(', ')}</p>` : ''}
            </div>
            <div class="flex gap-1">
                <button onclick='editSkill(${JSON.stringify(s)})' class="text-xs text-indigo-600 hover:underline">Edit</button>
                <button onclick="deleteSkill(${s.id})" class="text-xs text-red-600 hover:underline">Del</button>
            </div>
        </div>
    `).join('');
}

function showSkillModal(s) {
    document.getElementById('skillEditId').value = s?.id || '';
    document.getElementById('skName').value = s?.name || '';
    document.getElementById('skCategory').value = s?.category || 'programming';
    document.getElementById('skDesc').value = s?.description || '';
    document.getElementById('skSub').value = (s?.subconcepts || []).join(', ');
    document.getElementById('skillModalTitle').textContent = s ? 'Edit Skill' : 'Add Skill Concept';
    document.getElementById('skillModal').classList.remove('hidden');
}
function editSkill(s) { showSkillModal(s); }
function closeSkillModal() { document.getElementById('skillModal').classList.add('hidden'); }

async function saveSkill() {
    const id = document.getElementById('skillEditId').value;
    const body = {
        name: document.getElementById('skName').value,
        category: document.getElementById('skCategory').value,
        description: document.getElementById('skDesc').value,
        subconcepts: document.getElementById('skSub').value.split(',').map(s=>s.trim()).filter(Boolean),
    };
    if (id) {
        await fetch(`${API}/skills/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    } else {
        await fetch(`${API}/skills`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    }
    closeSkillModal(); loadSkills();
}

async function deleteSkill(id) {
    if (!confirm('Delete this skill concept?')) return;
    await fetch(`${API}/skills/${id}`, {method:'DELETE'});
    loadSkills();
}

// Roles
async function loadRoles() {
    const res = await fetch(`${API}/roles`);
    renderRoles(await res.json());
}

function renderRoles(roles) {
    const el = document.getElementById('rolesList');
    if (!roles.length) { el.innerHTML = '<p class="text-gray-500 text-sm">No role archetypes yet.</p>'; return; }
    el.innerHTML = roles.map(r => `
        <div class="bg-white rounded-lg shadow-sm border p-4">
            <div class="flex justify-between items-start">
                <div>
                    <span class="font-semibold text-gray-900">${r.name}</span>
                    <span class="text-xs text-gray-400 ml-2">v${r.version}</span>
                    <p class="text-sm text-gray-600 mt-1">${r.description || '—'}</p>
                </div>
                <div class="flex gap-1">
                    <button onclick='editRole(${JSON.stringify(r)})' class="text-xs text-indigo-600 hover:underline">Edit</button>
                    <button onclick="deleteRole(${r.id})" class="text-xs text-red-600 hover:underline">Del</button>
                </div>
            </div>
            ${r.core_skills.length ? `<p class="text-xs mt-2"><span class="font-medium">Core:</span> ${r.core_skills.map(s=>s.skill_name||'#'+s.skill_concept_id).join(', ')}</p>` : ''}
            ${r.adjacent_skills.length ? `<p class="text-xs"><span class="font-medium">Adjacent:</span> ${r.adjacent_skills.map(s=>s.skill_name||'#'+s.skill_concept_id).join(', ')}</p>` : ''}
            ${r.green_flags.length ? `<p class="text-xs text-green-700">✓ ${r.green_flags.join(', ')}</p>` : ''}
            ${r.red_flags.length ? `<p class="text-xs text-red-700">✗ ${r.red_flags.join(', ')}</p>` : ''}
        </div>
    `).join('');
}

function showRoleModal(r) {
    document.getElementById('roleEditId').value = r?.id || '';
    document.getElementById('rlName').value = r?.name || '';
    document.getElementById('rlDesc').value = r?.description || '';
    document.getElementById('rlGreen').value = (r?.green_flags || []).join(', ');
    document.getElementById('rlRed').value = (r?.red_flags || []).join(', ');
    document.getElementById('roleModalTitle').textContent = r ? 'Edit Role' : 'Add Role Archetype';
    document.getElementById('roleModal').classList.remove('hidden');
}
function editRole(r) { showRoleModal(r); }
function closeRoleModal() { document.getElementById('roleModal').classList.add('hidden'); }

async function saveRole() {
    const id = document.getElementById('roleEditId').value;
    const body = {
        name: document.getElementById('rlName').value,
        description: document.getElementById('rlDesc').value,
        green_flags: document.getElementById('rlGreen').value.split(',').map(s=>s.trim()).filter(Boolean),
        red_flags: document.getElementById('rlRed').value.split(',').map(s=>s.trim()).filter(Boolean),
    };
    if (id) {
        await fetch(`${API}/roles/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    } else {
        await fetch(`${API}/roles`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    }
    closeRoleModal(); loadRoles();
}

async function deleteRole(id) {
    if (!confirm('Delete this role archetype?')) return;
    await fetch(`${API}/roles/${id}`, {method:'DELETE'});
    loadRoles();
}

// Export/Import
async function exportKB() {
    const res = await fetch(`${API}/export`);
    const data = await res.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `superrecruit-kb-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}

async function importKB(event) {
    const file = event.target.files[0];
    if (!file) return;
    const text = await file.text();
    const data = JSON.parse(text);
    const res = await fetch(`${API}/import`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
    const stats = await res.json();
    const el = document.getElementById('importStatus');
    el.textContent = `Imported: ${stats.skills_created} skills, ${stats.roles_created} roles, ${stats.employers_created} employers`;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 4000);
    loadSkills(); loadRoles();
    event.target.value = '';
}

// Init
loadSkills(); loadRoles();
</script>
{% endblock %}
