{% extends "base.html" %}
{% block title %}SuperRecruit — Upload Resume{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Skills Verification Engine</h1>
        <p class="text-gray-600">Upload a resume to analyze claimed skills, assess confidence, and generate targeted assessments.</p>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <form action="/api/candidates/upload" method="post" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Candidate Name</label>
                <input type="text" name="name" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone (optional)</label>
                <input type="text" name="phone" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Resume (PDF)</label>
                <input type="file" name="file" accept=".pdf" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 font-medium">
                Upload & Analyze
            </button>
        </form>
    </div>
</div>
{% endblock %}
