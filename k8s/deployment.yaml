apiVersion: apps/v1
kind: Deployment
metadata:
  name: superrecruit
  namespace: superrecruit
  labels:
    app: superrecruit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superrecruit
  template:
    metadata:
      labels:
        app: superrecruit
    spec:
      nodeSelector:
        kubernetes.io/hostname: razer
      containers:
        - name: superrecruit
          image: superrecruit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: superrecruit-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: superrecruit-secrets
                  key: ANTHROPIC_API_KEY
            - name: SR_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superrecruit-secrets
                  key: SR_SMTP_PASSWORD
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: superrecruit-data
