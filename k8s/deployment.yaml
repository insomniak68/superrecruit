apiVersion: apps/v1
kind: Deployment
metadata:
  name: superrecruit
  namespace: superrecruit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superrecruit
  template:
    metadata:
      labels:
        app: superrecruit
    spec:
      nodeSelector:
        kubernetes.io/hostname: razer
      initContainers:
        - name: setup
          image: python:3.12-slim
          command:
            - /bin/bash
            - -c
            - |
              apt-get update && apt-get install -y git
              cd /app
              if [ ! -f requirements.txt ]; then
                git clone https://github.com/insomniak68/superrecruit.git .
              fi
              pip install --no-cache-dir --target=/app/deps -r requirements.txt
          volumeMounts:
            - name: app
              mountPath: /app
            - name: data
              mountPath: /data
      containers:
        - name: superrecruit
          image: python:3.12-slim
          command:
            - /bin/bash
            - -c
            - |
              export PYTHONPATH=/app/deps:/app
              python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
          workingDir: /app
          ports:
            - containerPort: 8000
          env:
            - name: SR_DB_PATH
              value: /data/superrecruit.db
          volumeMounts:
            - name: app
              mountPath: /app
            - name: data
              mountPath: /data
              subPath: data
      volumes:
        - name: app
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: superrecruit-data
