version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SR_DB_PATH=/app/data/superrecruit.db
    volumes:
      - superrecruit-data:/app/data
    restart: unless-stopped
    # Future: add postgres service and switch SR_DB_PATH to a connection string
    # postgres:
    #   image: postgres:16-alpine
    #   environment:
    #     POSTGRES_DB: superrecruit
    #     POSTGRES_USER: superrecruit
    #     POSTGRES_PASSWORD: changeme
    #   volumes:
    #     - pg-data:/var/lib/postgresql/data

volumes:
  superrecruit-data:
