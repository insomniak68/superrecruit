components:
  schemas:
    Body_bulk_upload_api_bulk_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_bulk_upload_api_bulk_post
    Body_upload_resume_api_candidates_upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
        name:
          type: string
          title: Name
        email:
          type: string
          title: Email
        phone:
          type: string
          title: Phone
          default: ''
      type: object
      required:
      - file
      - name
      - email
      title: Body_upload_resume_api_candidates_upload_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SubmissionCreate:
      properties:
        name:
          type: string
          title: Name
        email:
          type: string
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        resume:
          anyOf:
          - type: string
          - type: 'null'
          title: Resume
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - name
      - email
      title: SubmissionCreate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
